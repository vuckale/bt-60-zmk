manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
  projects:
    - name: zmk
      remote: zmkfirmware
      # "main" tracks the newest ZMK (Zephyr 4.1, hardware model v2).
      # To freeze a known-good state later, replace it with a commit SHA.
      revision: main
      import: app/west.yml
  self:
    path: config
