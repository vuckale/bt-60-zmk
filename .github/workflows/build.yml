name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    # ZMK's own reusable workflow: it uses the current build image, does
    # west init/update/zephyr-export, builds every entry in ../../build.yaml
    # and uploads the result as a single "firmware" artifact.
    # Keep this ref in sync with the ZMK revision in config/west.yml.
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
